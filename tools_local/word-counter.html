<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Counter</title>
<style>
:root{
  --brand:#2563EB;
  --brand-d:#1D4ED8;
  --accent:#14B8A6;
  --navy:#0F172A;
  --navy2:#1E293B;
  --bg:#F8FAFC;
  --card:#FFFFFF;
  --text:#0F172A;
  --muted:#475569;
  --line:#E2E8F0;
  --soft:#EFF6FF;
  --link:#1D4ED8;
  --ok:#15803D; --warn:#B45309; --err:#DC2626;
  --r:14px;
  --sh:0 1px 2px rgba(15,23,42,.06),0 10px 30px rgba(15,23,42,.07);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
}
html[data-theme='dark']{
  --bg:#0B1220; --card:#111B2F; --text:#E6ECF5; --muted:#A3B1C6; --line:#24324D; --soft:#15233F; --link:#7DB1FF;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:1.25em;height:1.25em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:.95rem;cursor:pointer;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--brand);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:.9rem}
.hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],input[type=url],select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.22);outline:none}
textarea{min-height:170px;resize:vertical;line-height:1.55}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500;font-size:.95rem}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.tool-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--soft);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:1.6rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.stat span{font-size:.82rem;color:var(--muted);font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:600;font-size:.82rem}
.bar{display:block;height:6px;border-radius:9px;background:var(--brand);min-width:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#0F172A;color:#fff;padding:11px 20px;border-radius:99px;font-size:.92rem;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:300;border:1px solid rgba(255,255,255,.15)}
.toast.show{opacity:1;transform:translate(-50%,0)}
body{padding:20px}
</style></head>
<body>
<div class="tool-box" id="rt-ui"></div>
<div class="toast" id="toast">&#160;</div>
<script>
var doc=document;
function $(s,r){return (r||doc).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var ICONS={
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 paste:'<rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>'
};
function icon(n,c){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';}
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},1900);}
function copy(x,l){try{navigator.clipboard.writeText(x);}catch(e){}toast(l||'Copied');}
var TH={tools:[],$:$,esc:esc,icon:icon,copy:copy,toast:toast,fmt:function(n,d){return Number(n).toLocaleString('en-US',{maximumFractionDigits:d===undefined?2:d});}};
TH.add=function(d){TH.tools.push(d);};
window.TH=TH;
(function(TH){try{
var $=TH.$,icon=TH.icon;
TH.add({
 slug:'word-counter',name:'Word Counter',h1:'Word & Character Counter',cat:'Text',icon:'file',
 short:'Count words, characters, sentences and paragraphs, with reading time and keyword density.',
 render:function(root){
  root.innerHTML=
   '<div class="field"><label for="wc-in">Type or paste your text</label><textarea id="wc-in" placeholder="Start typing or paste your text here..." spellcheck="true"></textarea></div>'
   +'<div class="btn-row" style="margin-top:0">'
   +'<button class="btn" type="button" id="wc-paste">'+icon('paste')+'Paste</button>'
   +'<button class="btn" type="button" id="wc-sample">Sample text</button>'
   +'<button class="btn" type="button" id="wc-copy">'+icon('copy')+'Copy text</button>'
   +'<button class="btn" type="button" id="wc-clear">'+icon('trash')+'Clear</button></div>'
   +'<div class="stats" id="wc-stats"></div>'
   +'<h2 style="font-size:1.15rem;margin-top:8px">Keyword density</h2>'
   +'<label class="chk" style="margin-bottom:10px"><input type="checkbox" id="wc-stop" checked> Ignore common words such as &ldquo;the&rdquo; and &ldquo;and&rdquo;</label>'
   +'<div id="wc-kw"></div>';
  var inp=$('#wc-in',root),st=$('#wc-stats',root),kw=$('#wc-kw',root),stop=$('#wc-stop',root);
  var STOP='a an the and or but if of to in on at by for with from as is are was were be been being it its this that these those you he she we they me my your our their not no so do does did have has had will would can could should than then there here what which who whom how when where why into about over under also just very'.split(' ');
  function dur(sec){if(sec<1){return '0 sec';}if(sec<60){return Math.round(sec)+' sec';}var m=Math.floor(sec/60),s=Math.round(sec%60);return m+' min'+(s?' '+s+' sec':'');}
  function calc(){
    var t=inp.value,tr=t.trim();
    var words=tr?(tr.match(/\S+/g)||[]):[];
    var sent=tr?tr.split(/[.!?\u06D4\u061F]+(?:\s|$)/).filter(function(s){return s.trim();}).length:0;
    var paras=tr?tr.split(/\n\s*\n/).filter(function(s){return s.trim();}).length:0;
    var n=words.length;
    var cells=[[n,'Words'],[t.length,'Characters'],[t.replace(/\s/g,'').length,'Characters (no spaces)'],[sent,'Sentences'],[paras,'Paragraphs'],[dur(n/200*60),'Reading time'],[dur(n/130*60),'Speaking time']];
    st.innerHTML=cells.map(function(c){return '<div class="stat"><b>'+(typeof c[0]==='number'?TH.fmt(c[0],0):c[0])+'</b><span>'+c[1]+'</span></div>';}).join('');
    var list=tr.toLowerCase().match(/[\p{L}\p{N}'\u2019-]+/gu)||[],map={},total=list.length;
    list.forEach(function(w){w=w.replace(/^['\u2019-]+|['\u2019-]+$/g,'');if(!w){return;}if(stop.checked&&(w.length<3||STOP.indexOf(w)!==-1)){return;}map[w]=(map[w]||0)+1;});
    var rows=Object.keys(map).map(function(k){return [k,map[k]];}).sort(function(a,b){return b[1]-a[1]||(a[0]<b[0]?-1:1);}).slice(0,10);
    if(!rows.length){kw.innerHTML='<p class="hint">Type some text to see which words you use most often.</p>';return;}
    var max=rows[0][1];
    kw.innerHTML='<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Keyword</th><th>Count</th><th>Density</th><th style="width:35%"></th></tr></thead><tbody>'
      +rows.map(function(r){return '<tr><td>'+TH.esc(r[0])+'</td><td>'+r[1]+'</td><td>'+(r[1]/total*100).toFixed(1)+'%</td><td><span class="bar" style="width:'+Math.max(4,r[1]/max*100)+'%"></span></td></tr>';}).join('')
      +'</tbody></table></div>';
  }
  inp.addEventListener('input',calc);stop.addEventListener('change',calc);
  $('#wc-clear',root).addEventListener('click',function(){inp.value='';calc();inp.focus();});
  $('#wc-copy',root).addEventListener('click',function(){if(!inp.value){TH.toast('Nothing to copy yet');return;}TH.copy(inp.value,'Text copied');});
  $('#wc-sample',root).addEventListener('click',function(){inp.value='Good writing is clear, direct and easy to follow. Short sentences help readers keep pace. Longer sentences can add detail, but only when every word earns its place.\n\nA quick word count shows how long a piece is. Reading time shows how much attention it asks for. Keyword density shows which ideas the text keeps returning to.';calc();});
  $('#wc-paste',root).addEventListener('click',function(){
    if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(x){inp.value+=x;calc();},function(){TH.toast('Clipboard blocked. Press Ctrl+V in the box.');inp.focus();});}
    else{TH.toast('Press Ctrl+V in the box to paste');inp.focus();}
  });
  calc();
 }
});
}catch(e){console.error(e);}})(window.TH);
TH.tools[0].render($('#rt-ui'));
</script>
</body></html>
